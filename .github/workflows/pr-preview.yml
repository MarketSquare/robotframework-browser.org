name: PR preview

# Builds a pull request and publishes it to a surge.sh domain of its own, then
# comments the link on the PR. This is how the site gets reviewed: the release
# workflow opens PRs nobody wrote by hand, and a link is the only practical way
# to check what they did.
#
# `pull_request`, deliberately NOT `pull_request_target`.
#
# pull_request_target runs with the base repository's secrets and, in the
# pattern usually copied alongside it, checks out the pull request's code —
# which hands a fork's code our surge token. A pull request from a fork gets no
# preview here; a maintainer who wants one can push the branch to this
# repository. That trade is worth it for a token that can publish to a domain.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Newer pushes supersede older ones: a preview of a stale commit is worse than
# no preview, because it looks current.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generate, test and check the bundle. A preview of a build that fails
      # its own checks would invite someone to approve it.
      - run: pnpm verify

      - name: Publish preview
        id: preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN is not set — skipping the preview."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DOMAIN="rfbrowser-pr-${{ github.event.pull_request.number }}.surge.sh"

          # A static host serves /docs/x/ with the slash; without a 200 page
          # surge answers unknown paths with its own 404 rather than ours.
          cp .output/public/404.html .output/public/200.html 2>/dev/null || true

          npx --yes surge ./.output/public "$DOMAIN" --token "$SURGE_TOKEN"

          echo "url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Comment the link
        if: steps.preview.outputs.skipped != 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL
            const marker = '<!-- pr-preview -->'
            const body = [
              marker,
              `### Preview`,
              ``,
              `${url}`,
              ``,
              `| | |`,
              `|---|---|`,
              `| Commit | \`${context.sha.slice(0, 7)}\` |`,
              `| Landing | ${url}/ |`,
              `| Keywords | ${url}/keywords |`,
              `| Releases | ${url}/releases |`,
              ``,
              `Rebuilt on every push to this branch, and taken down when it closes.`,
            ].join('\n')

            // Edit our own comment rather than adding one per push.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
