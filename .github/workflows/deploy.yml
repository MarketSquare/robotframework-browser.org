name: Deploy

# Builds the static site and publishes it to GitHub Pages.
#
# Deployment is gated on a repository variable, PAGES_LIVE. Until it is set to
# "true", this workflow builds and tests on every push to main but publishes
# nothing — because this repository already serves the live site from the
# legacy branch, and GitHub Pages has one source. Publishing before the
# cutover would replace the live site the moment main was first pushed.
#
# At cutover: set the Pages source to "GitHub Actions", then set the repository
# variable PAGES_LIVE to true. To roll back, unset it and point Pages at the
# legacy branch again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds first, so the assertions about prerendered output actually run.
      - run: pnpm verify

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - if: vars.PAGES_LIVE == 'true'
        uses: actions/configure-pages@v6
      - if: vars.PAGES_LIVE == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    # The cutover switch. Unset or "false" means build, test, publish nothing.
    if: vars.PAGES_LIVE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
